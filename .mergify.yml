pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: vm6-qrule-new-261005
    queue_conditions:
      - base = vm6-qrule-target-261005
      - title = VM6_QRULE_REMOVE_261005
    merge_conditions:
      - label = VM6_NEVER_ALLOW_261005
    batch_size: 2
    batch_max_wait_time: 90 seconds
    merge_method: merge
    max_checks_retries: 0
    checks_timeout: null
  - name: vm6-railsstructure-isolated-261013
    queue_conditions:
      - base = vm6-railsstructure-base-261013
      - title ~= ^VM6_RAILSSTRUCTURE_[AB]_261013$
    merge_conditions:
      - check-success = vm6-rails-never-check-261013
    batch_size: 2
    batch_max_wait_time: 45 seconds
    merge_method: merge-batch
    checks_timeout: null

conflict_resolvers:
  - paths:
      - db/structure.sql
    strategy: rails-structure
